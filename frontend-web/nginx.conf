server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # ─── V-N4 Fix: Cabeceras de Seguridad HTTP ──────────────────────────────────
    # Previene MIME type sniffing (ataques de tipo confusión de contenido)
    add_header X-Content-Type-Options "nosniff" always;

    # Previene que la app sea embebida en iframes (clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Fuerza HTTPS en futuras visitas (HSTS) — activar solo con dominio real + TLS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Política de referencia: no filtra la URL interna al hacer peticiones externas
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy: solo carga recursos del mismo origen + Google APIs (reCAPTCHA/OAuth)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:9005; connect-src 'self' http://localhost:8000 https://www.google.com; frame-src https://www.google.com;" always;

    # Restringe el acceso a APIs del navegador no necesarias
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # ────────────────────────────────────────────────────────────────────────────

    # Servir el frontend React (SPA - Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso: redirige /api/* al API Gateway (Kong)
    location /api/ {
        proxy_pass http://unl_api_gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso: expone MinIO a través de HTTPS para evitar errores de Mixed Content
    location /unl-eventos-media/ {
        proxy_pass http://unl_minio_storage:9000/unl-eventos-media/;
        proxy_set_header Host $http_host;
    }
}
