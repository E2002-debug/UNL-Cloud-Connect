apiVersion: apps/v1
kind: Deployment
metadata:
  name: unl-api-gateway
  namespace: unl-cloud-connect
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: kong
        image: kong:3.4-ubuntu
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: /kong/declarative/kong.yml
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000"
        - name: KONG_ADMIN_LISTEN
          value: "127.0.0.1:8001"
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: kong-config
          mountPath: /kong/declarative/kong.yml
          subPath: kong.yml
      volumes:
      - name: kong-config
        configMap:
          name: kong-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: unl-cloud-connect
spec:
  type: LoadBalancer # Permite acceso público al Gateway
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
