apiVersion: apps/v1
kind: Deployment
metadata:
  name: unl-ms-clima
  namespace: unl-cloud-connect
  labels:
    app: ms-clima
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-clima
  template:
    metadata:
      labels:
        app: ms-clima
    spec:
      containers:
      - name: ms-clima
        image: ghcr.io/${GITHUB_OWNER}/unl-ms_clima:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: ms-clima-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/clima/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ms-clima-service
  namespace: unl-cloud-connect
spec:
  selector:
    app: ms-clima
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
