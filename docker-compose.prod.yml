version: '3.8'

services:
  # Sobrescribir la configuración del Frontend para producción HTTPS
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_WEATHER_API_KEY: ${VITE_WEATHER_API_KEY}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Montar los certificados generados por Certbot en la VM hacia el contenedor
      - /etc/letsencrypt:/etc/letsencrypt:ro

  # Inyectar la URL del nuevo dominio al backend para que la use en los correos
  ms-gestion-usuarios:
    environment:
      - FRONTEND_URL=https://unl-cloud-connect.me
