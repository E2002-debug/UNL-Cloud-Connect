services:
  # 1. Base de Datos Relacional (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: unl_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: postgres123456
    ports:
      - "5433:5432"
     
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infraestructura/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh

  # 2. Broker MQTT para Telemetría IoT (Mosquitto)
  mqtt-broker:
    image: eclipse-mosquitto:1.6
    container_name: unl_mqtt_broker
    restart: always
    ports:
      - "1884:1883"     # Puerto para la comunicación del ESP32
      - "9003:9001"     # Puerto para WebSockets (futuro)
    volumes:
      - ./infraestructura/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./infraestructura/mosquitto/data:/mosquitto/data
      - ./infraestructura/mosquitto/log:/mosquitto/log

  # 3. Almacenamiento de Objetos Multimedia (MinIO)
  minio:
    image: minio/minio:latest
    container_name: unl_minio_storage
    restart: always
    ports:
      - "9005:9000"     # Puerto de la API de MinIO
      - "9002:9001"     # Consola Web de administración
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio123456
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

 # 4. Microservicio de Identidad (Login, Registro, Roles)
  ms-gestion-usuarios:
    build:
      context: ./backend/ms_gestion_usuarios
      dockerfile: Dockerfile
    container_name: unl_ms_gestion_usuarios
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/ms_gestion_usuarios/app:/app/app
    env_file:
      - ./backend/ms_gestion_usuarios/.env   # Carga segura de variables de entorno
    depends_on:
      - db

# 5. Microservicio de Telemetría (ESP32-CAM, IoT)
  ms-clima:
    build:
      context: ./backend/ms_clima
      dockerfile: Dockerfile
    container_name: unl_ms_clima
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/ms_clima/app:/app/app
    env_file:
      - ./backend/ms_clima/.env      # Carga segura de variables de entorno
    environment:
      - MQTT_BROKER_HOST=mqtt-broker # Le indicamos por qué red interna llegar a Mosquitto
    depends_on:
      - db
      - mqtt-broker


  #6. API Gateway (Kong)

  api-gateway:
    image: kong:3.4-ubuntu
    container_name: unl_api_gateway
    restart: always
    environment:
      KONG_DATABASE: "off"          # Modo DB-less
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"  # ¡ESTE ES EL ÚNICO PUERTO QUE VERÁ EL FRONTEND!
      - "8001:8001"  # Puerto de administración local
    volumes:
      - ./infraestructura/kong/kong.yml:/kong/declarative/kong.yml
    depends_on:
      - ms-gestion-usuarios
      - ms-clima

volumes:
  postgres_data:
  mosquitto_data:
  minio_data: