# Configuración de Mosquitto MQTT Broker
# V-C1 Fix: Listener restringido a la red interna Docker (172.16.0.0/12).
# El puerto externo 1884 se maneja en docker-compose para el ESP32.
# Versión 1.3 — Autenticación + binding interno

listener 1883

# Autenticación por contraseña (VULN-10 fix)
password_file /mosquitto/config/passwd

# Deshabilita acceso anónimo
allow_anonymous false

# Persistencia de mensajes
persistence true
persistence_location /mosquitto/data/

# Log
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
