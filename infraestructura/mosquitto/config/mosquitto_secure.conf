# Configuración de Mosquitto MQTT Broker
# ⚠️  SEGURIDAD: Solo permite conexiones desde la red interna de Docker.
# Versión 1.2 — Autenticación habilitada (password_file)

listener 1883 0.0.0.0

# Autenticación por contraseña (VULN-10 fix)
password_file /mosquitto/config/passwd

# Deshabilita acceso anónimo
allow_anonymous false

# Persistencia de mensajes
persistence true
persistence_location /mosquitto/data/

# Log
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
