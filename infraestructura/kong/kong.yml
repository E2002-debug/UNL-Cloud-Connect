# Historial:
# 07/07/2026 v1.1 - Miguel Luna: Integración de la ruta para ms-notificaciones y configuración del plugin request-transformer para mitigación de vulnerabilidad RBAC (Strip Headers).

_format_version: "3.0"
_transform: true

# ==========================================
# DEFINICIÓN DE SERVICIOS (Tus Microservicios)
# ==========================================
services:
  # 1. Servicio de Usuarios
  - name: servicio-usuarios
    url: http://ms-gestion-usuarios:8000 # Usa el nombre del SERVICIO (Docker Swarm ignora container_name)
    routes:
      - name: ruta-usuarios
        paths:
          - /api/auth
          - /api/usuarios
          - /api/auditoria
        strip_path: false

  # 2. Servicio de Clima/Telemetría
  - name: servicio-clima
    url: http://ms-clima:8000
    routes:
      - name: ruta-clima
        paths:
          - /api/clima
        strip_path: false

  # 3. Servicio de Eventos 
  - name: servicio-eventos
    url: http://ms-eventos:8000 
    routes:
      - name: ruta-eventos
        paths:
          - /api/eventos  
          - /api/imagenes
        strip_path: false
    plugins:
      - name: request-transformer
        config:
          remove:
            headers:
              - x-user-id
              - x-user-role

  # 4. Servicio de Notificaciones
  - name: servicio-notificaciones
    url: http://ms-notificaciones:8000
    routes:
      - name: ruta-notificaciones
        paths:
          - /api/notificaciones
        strip_path: false

# ==========================================
# FIN DE CONFIGURACIÓN
# ==========================================