_format_version: "3.0"
_transform: true

# ==========================================
# DEFINICIÓN DE SERVICIOS (Tus Microservicios)
# ==========================================
services:
  # 1. Servicio de Usuarios
  - name: servicio-usuarios
    url: http://ms-gestion-usuarios:8000 # Usa el nombre del SERVICIO (Docker Swarm ignora container_name)
    routes:
      - name: ruta-usuarios
        paths:
          - /api/auth
          - /api/usuarios
        strip_path: false

  # 2. Servicio de Clima/Telemetría
  - name: servicio-clima
    url: http://ms-clima:8000
    routes:
      - name: ruta-clima
        paths:
          - /api/clima
        strip_path: false

  # 3. Servicio de Eventos 
  - name: servicio-eventos
    url: http://unl_ms_eventos:8000 # Nombre del contenedor en docker-compose
    routes:
      - name: ruta-eventos
        paths:
          - /api/eventos  
          - /api/imagenes
        strip_path: false

# ==========================================
# PLUGINS GLOBALES
# ==========================================
plugins:
  # Habilitamos CORS globalmente en el Gateway
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600